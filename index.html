<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tenzor Sailing Club · Сезон 2026/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Layout: one phone-width column. Ближайший этап сверху, затем фильтры, затем
   либо сетка месяца, либо лента всего сезона. Карточка этапа устроена как
   посадочный талон: дата слева, этап в центре, коэффициент K справа. */
:root{
  color-scheme:dark;
  --navy-900:#061430;
  --navy-800:#0B2052;
  --navy-700:#143272;
  --brand:#244C9A;
  --ice:#EEF4FF;
  --muted:#9FB3DB;
  --line:rgba(140,200,255,.16);
  --panel:rgba(255,255,255,.055);
  --cyan:#3DD9EB;
  --gold:#FFC53D;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--body);color:var(--ice);min-height:100vh;
  background:var(--navy-900);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,transparent 0 63px,rgba(255,255,255,.045) 63px 64px),
    repeating-linear-gradient(90deg,transparent 0 63px,rgba(255,255,255,.045) 63px 64px),
    radial-gradient(120% 60% at 85% -5%,rgba(61,217,235,.22),transparent 60%),
    radial-gradient(90% 50% at 0% 30%,rgba(36,76,154,.75),transparent 70%),
    linear-gradient(180deg,var(--navy-700) 0%,var(--navy-800) 38%,var(--navy-900) 100%);
}
.app{
  position:relative;z-index:1;max-width:480px;margin:0 auto;
  padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(104px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* Шапка */
.top{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.logo{width:210px;max-width:62%;height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35));animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.season{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
.facts{font-size:13px;color:var(--muted);font-weight:500}

/* Ближайший этап */
.next{
  position:relative;overflow:hidden;width:100%;text-align:left;border:1px solid rgba(255,255,255,.22);
  border-radius:22px;padding:18px 18px 16px;
  background:linear-gradient(135deg,#2D5FC0 0%,var(--brand) 45%,#16357C 100%);
  box-shadow:0 18px 40px rgba(2,10,30,.5);
  display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:end;
}
.next::after{ /* парус */
  content:"";position:absolute;right:-30px;top:-20px;width:190px;height:230px;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,0) 70%);
  clip-path:polygon(62% 0,100% 100%,0 86%);
}
.next > *{position:relative;z-index:1}
.next .eyebrow{grid-column:1/-1;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.next h2{grid-column:1/-1;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2;text-wrap:balance;margin-top:4px}
.next .meta{font-size:13.5px;line-height:1.5;color:#DCE8FF;font-weight:500;min-width:0}
.next .count{text-align:right;line-height:1}
.next .count b{display:block;font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.next .count span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#DCE8FF}
.next .count.live b{font-size:22px;color:var(--gold);letter-spacing:0}

/* Фильтры */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:flex;align-items:center;gap:7px;white-space:nowrap;
  padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  font-size:13px;font-weight:700;color:var(--ice);transition:background .2s,border-color .2s,color .2s;
}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ice);color:var(--navy-800);border-color:var(--ice)}

/* Коэффициент K */
.kbox{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:14px}
.kbox summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;font-size:14px;cursor:pointer}
.kbox summary::-webkit-details-marker{display:none}
[hidden]{display:none!important}
.kright{display:flex;align-items:center;gap:10px}
.kbox summary em{font-style:normal;font-size:11.5px;font-weight:800;color:var(--navy-900);background:var(--gold);border-radius:999px;padding:3px 9px}
.chev{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel);position:relative;transition:transform .25s ease}
.chev::before{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-6px 0 0 -4px;border-right:2px solid var(--ice);border-bottom:2px solid var(--ice);transform:rotate(45deg)}
.kbox[open] .chev{transform:rotate(180deg)}
.kbox p{font-size:13px;line-height:1.55;color:var(--muted);margin:10px 0 12px}
.krow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kbtn{border:1px solid var(--line);background:transparent;border-radius:12px;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:5px}
.kbtn b{font-family:var(--display);font-size:15px;font-weight:700;color:var(--gold)}
.kbtn small{font-size:10.5px;color:var(--muted);font-weight:600}
.kbtn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold)}
.kbtn[aria-pressed="true"] b,.kbtn[aria-pressed="true"] small{color:var(--navy-900)}
.kbtn[aria-pressed="true"] .pen i{background:rgba(6,20,48,.25)}
.kbtn[aria-pressed="true"] .pen i.on{background:var(--navy-900)}
.pen{display:flex;gap:2px}
.pen i{width:7px;height:9px;background:rgba(255,255,255,.16);clip-path:polygon(0 0,100% 50%,0 100%)}
.pen i.on{background:var(--gold)}

/* Переключатель вида */
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:800;font-size:13px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ice);color:var(--navy-800)}

/* Лента месяцев */
.mstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px;scroll-behavior:smooth}
.mstrip::-webkit-scrollbar{display:none}
.mpill{flex:none;min-width:58px;border:1px solid transparent;background:transparent;border-radius:14px;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:3px}
.mpill .y{font-size:10px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.mpill .m{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em}
.mpill .n{font-size:10.5px;font-weight:700;color:var(--cyan)}
.mpill.empty .n{color:rgba(159,179,219,.5)}
.mpill[aria-pressed="true"]{background:var(--panel);border-color:var(--cyan)}

/* Сетка месяца */
.cal{border:1px solid var(--line);border-radius:22px;background:rgba(6,20,48,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:16px 12px 12px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding-inline:4px}
.calhead h3{font-family:var(--display);font-weight:700;font-size:18px}
.calhead h3 span{color:var(--muted);font-weight:500}
.nav{display:flex;gap:6px}
.nav button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:18px;line-height:1}
.nav button:disabled{opacity:.3;cursor:default}
.wd,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.wd span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;letter-spacing:.06em}
.wd span:nth-child(n+6){color:var(--cyan)}
.grid{row-gap:2px}
.day{position:relative;height:44px;border:0;background:transparent;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ice)}
.day.blank{pointer-events:none}
.day span{position:relative;z-index:1}
.day.has{font-weight:800}
.day.has::before{content:"";position:absolute;inset:5px 0;background:var(--c);opacity:.34}
.day.start::before{left:3px;border-top-left-radius:12px;border-bottom-left-radius:12px}
.day.end::before{right:3px;border-top-right-radius:12px;border-bottom-right-radius:12px}
.day.today span::after{content:"";position:absolute;left:50%;bottom:-7px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold)}
.day.sel::after{content:"";position:absolute;inset:3px 4px;border:2px solid var(--ice);border-radius:12px;z-index:2}

/* Список этапов */
.list{display:flex;flex-direction:column;gap:10px}
.lhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.lhead h4{font-family:var(--display);font-weight:700;font-size:15px}
.lhead span,.lhead button{font-size:12px;font-weight:700;color:var(--muted)}
.lhead button{background:none;border:0;color:var(--cyan);padding:4px 0}
.card{
  display:grid;grid-template-columns:62px 1fr auto;align-items:stretch;
  border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden;
  animation:rise .35s ease both;
}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.card.past{opacity:.5}
.card.live{border-color:var(--gold)}
.cdate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 4px;background:rgba(0,0,0,.22);border-right:1px dashed var(--line);text-align:center}
.cdate b{font-family:var(--display);font-weight:700;font-size:15px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.cdate small{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.cdate.tbd b{font-size:11px;font-weight:500;line-height:1.25;white-space:normal;color:var(--muted)}
.cmain{min-width:0;padding:12px 10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.cser{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.cser i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.cmain h5{font-size:15px;font-weight:800;line-height:1.25}
.cmain p{font-size:12.5px;color:var(--muted);font-weight:500;line-height:1.4}
.cmain .st{color:var(--ice);font-weight:700}
.card.live .st{color:var(--gold)}
.ck{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 12px 10px 4px}
.ck b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;color:var(--gold)}
.ck b sup{font-size:11px;font-weight:700;vertical-align:top;margin-right:1px;position:relative;top:2px}
.empty{border:1px dashed var(--line);border-radius:18px;padding:22px 16px;text-align:center;font-size:13.5px;color:var(--muted);line-height:1.5}

/* Кнопка записи */
.cta{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:26px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(6,20,48,0),var(--navy-900) 46%);pointer-events:none;
}
.cta a{
  pointer-events:auto;display:block;max-width:448px;margin:0 auto;text-align:center;text-decoration:none;
  padding:16px;border-radius:16px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;
  color:var(--navy-900);background:linear-gradient(135deg,#FFFFFF,#CFE6FF);
  box-shadow:0 10px 30px rgba(61,217,235,.28);
}
.cta a:active{transform:translateY(1px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Заставка «Подъём паруса» */
#splash{position:fixed;inset:0;z-index:50;overflow:hidden;cursor:pointer;background:#0B2052}
.sp-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.sp-logo{position:absolute;left:0;right:0;top:10vh;display:flex;justify-content:center;pointer-events:none;transition:opacity .28s ease,transform .5s ease}
#splash.zoom .sp-logo{opacity:0;transform:scale(1.3)}
.sp-lw{position:relative;line-height:0}
.sp-svg{width:min(70vw,300px,40vh);height:auto;overflow:visible}
.sp-svg *{fill:#fff;fill-opacity:0;stroke:#fff;stroke-width:2.4;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.sp-svg .sh{animation:spDraw .6s cubic-bezier(.6,0,.3,1) .05s forwards,spFill .3s ease .55s forwards}
.sp-svg .tz{stroke:none;opacity:0;fill-opacity:1;transform:translateY(46px);animation:spUp .4s cubic-bezier(.2,.7,.2,1) .6s forwards}
.sp-svg .sc{stroke-width:1.6;animation:spDraw .6s ease-in-out .72s forwards,spFill .25s ease 1.15s forwards}
.sp-star{position:absolute;left:61%;top:2%;width:26px;height:26px;margin:-13px;background:#fff;transform:scale(0);
  clip-path:polygon(50% 0,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0 50%,43% 43%);animation:spStar .75s ease .7s forwards}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spFill{to{fill-opacity:1;stroke-opacity:0}}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spStar{0%{transform:scale(0) rotate(0)}45%{transform:scale(1.25) rotate(90deg)}100%{transform:scale(0) rotate(180deg)}}
body.reveal .app > *{animation:spEnter .6s cubic-bezier(.2,.7,.2,1) both}
body.reveal .app > :nth-child(2){animation-delay:.07s}
body.reveal .app > :nth-child(3){animation-delay:.14s}
body.reveal .app > :nth-child(4){animation-delay:.21s}
body.reveal .app > :nth-child(5){animation-delay:.28s}
body.reveal .app > :nth-child(6){animation-delay:.35s}
body.reveal .app > :nth-child(7){animation-delay:.42s}
@keyframes spEnter{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
</style>
</head>

  {s:['mec'], t:'Middle East Cup J/70', st:'1-й этап · Чемпионат ОАЭ в классе J/70', month:'2027-10', place:'ОАЭ', flag:'🇦🇪', k:4},
  {s:['mec'], t:'Middle East Cup J/70', st:'2-й этап · Чемпионат Бахрейна в классе J/70', month:'2027-11', place:'Бахрейн', flag:'🇧🇭', k:4},
  {s:['spec'], t:'Кубок ШОС по парусному спорту', st:'2-й этап', place:'Место по назначению', flag:'', k:3}
];

const MN = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MS = ['ЯНВ','ФЕВ','МАР','АПР','МАЙ','ИЮН','ИЮЛ','АВГ','СЕН','ОКТ','НОЯ','ДЕК'];

const toDate = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
const pl = (n,a,b,c) => { const m10=n%10, m100=n%100; return (m10===1&&m100!==11)?a:(m10>=2&&m10<=4&&(m100<10||m100>=20))?b:c; };
const now = new Date();
const TODAY = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const dayDiff = (a,b) => Math.round((a-b)/864e5);

const EVENTS = RAW.map((e,i) => ({
  ...e, id:i,
  a: e.from ? toDate(e.from) : null,
  b: e.to ? toDate(e.to) : null,
  mkey: e.from ? e.from.slice(0,7) : (e.month || null)
})).sort((x,y) => {
  const kx = x.a ? x.a.getTime() : (x.month ? toDate(x.month+'-28').getTime() : Infinity);
  const ky = y.a ? y.a.getTime() : (y.month ? toDate(y.month+'-28').getTime() : Infinity);
  return kx - ky;
});

// Месяцы сезона: декабрь 2026 — ноябрь 2027
const MONTHS = Array.from({length:12}, (_,i) => {
  const d = new Date(2026, 11+i, 1);
  return {y:d.getFullYear(), m:d.getMonth(), key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
});

const upcoming = EVENTS.find(e => e.a && e.b >= TODAY) || null;
const state = {
  series:'all', k:0, view:'month', day:null,
  mi: Math.max(0, MONTHS.findIndex(m => m.key === (upcoming ? upcoming.mkey : MONTHS[0].key)))
};

const $ = id => document.getElementById(id);
const match = e => (state.series==='all' || e.s.includes(state.series)) && (!state.k || e.k===state.k);
const color = e => SERIES[(state.series!=='all' && e.s.includes(state.series)) ? state.series : e.s[0]].c;

function rangeText(e){
  if(e.a){
    const same = e.a.getTime()===e.b.getTime();
    return (same ? e.a.getDate() : e.a.getDate()+'–'+e.b.getDate())+' '+MG[e.a.getMonth()]+' '+e.a.getFullYear();
  }
  if(e.month){ const d = toDate(e.month+'-01'); return MN[d.getMonth()].toLowerCase()+' '+d.getFullYear()+', дата по назначению'; }
  return 'дата по назначению';
}
function statusOf(e){
  if(!e.a) return {cls:'', text:'Дата по назначению'};
  if(TODAY > e.b) return {cls:'past', text:'Завершён'};
  if(TODAY >= e.a) return {cls:'live', text:'Идёт сейчас'};
  const n = dayDiff(e.a, TODAY);
  return {cls:'', text: n===1 ? 'Завтра' : 'Через '+n+' '+pl(n,'день','дня','дней')};
}
const pennants = k => '<span class="pen" aria-hidden="true">'+[1,2,3,4,5].map(i=>'<i'+(i<=k?' class="on"':'')+'></i>').join('')+'</span>';

function card(e){
  const st = statusOf(e), c = color(e);
  let date;
  if(e.a){
    const same = e.a.getTime()===e.b.getTime();
    date = '<div class="cdate"><b>'+(same?e.a.getDate():e.a.getDate()+'–'+e.b.getDate())+'</b><small>'+MS[e.a.getMonth()]+'</small></div>';
  } else {
    const lab = e.month ? MS[toDate(e.month+'-01').getMonth()] : '2027';
    date = '<div class="cdate tbd"><b>дата по назна&shy;чению</b><small>'+lab+'</small></div>';
  }
  const serName = e.s.map(k=>SERIES[k].short).join(' · ');
  return '<article class="card '+st.cls+'" style="--c:'+c+'">'+date+
    '<div class="cmain"><div class="cser"><i></i>'+serName+'</div>'+
    '<h5>'+e.t+'</h5>'+
    (e.st?'<p>'+e.st+'</p>':'')+
    '<p>'+(e.flag?e.flag+' ':'')+e.place+'</p>'+
    '<p class="st">'+st.text+'</p></div>'+
    '<div class="ck" title="Коэффициент K = '+e.k+'"><b><sup>K</sup>'+e.k+'</b>'+pennants(e.k)+'</div></article>';
}

function renderFacts(){
  const countries = new Set(EVENTS.map(e=>e.flag).filter(Boolean)).size;
  $('facts').textContent = EVENTS.length+' '+pl(EVENTS.length,'этап','этапа','этапов')+' · '+countries+' '+pl(countries,'страна','страны','стран')+' · декабрь 2026 — ноябрь 2027';
}

function renderNext(){
  const el = $('next');
  if(!upcoming){
    el.innerHTML = '<span class="eyebrow">Сезон завершён</span><h2>Все этапы сезона 2026/27 пройдены</h2><span class="meta">Смотрите календарь ниже</span>';
    return;
  }
  const live = TODAY >= upcoming.a, n = dayDiff(upcoming.a, TODAY);
  el.innerHTML = '<span class="eyebrow">'+(live?'Идёт сейчас':'Ближайший этап')+'</span>'+
    '<h2>'+upcoming.t+(upcoming.st?', '+upcoming.st:'')+'</h2>'+
    '<span class="meta">'+rangeText(upcoming)+'<br>'+upcoming.flag+' '+upcoming.place+' · K'+upcoming.k+'</span>'+
    (live ? '<span class="count live"><b>на воде</b></span>'
          : '<span class="count"><b>'+n+'</b><span>'+pl(n,'день','дня','дней')+' до старта</span></span>');
}

function renderChips(){
  const total = EVENTS.filter(e=>!state.k||e.k===state.k);
  let h = '<button class="chip" type="button" data-s="all" aria-pressed="'+(state.series==='all')+'">Все · '+total.length+'</button>';
  for(const k in SERIES){
    const n = total.filter(e=>e.s.includes(k)).length;
    h += '<button class="chip" type="button" data-s="'+k+'" style="--c:'+SERIES[k].c+'" aria-pressed="'+(state.series===k)+'"><i></i>'+SERIES[k].short+' · '+n+'</button>';
  }
  $('chips').innerHTML = h;
}

function renderK(){
  const base = EVENTS.filter(e=>state.series==='all'||e.s.includes(state.series));
  $('krow').innerHTML = [1,2,3,4,5].map(k=>{
    const n = base.filter(e=>e.k===k).length;
    return '<button class="kbtn" type="button" data-k="'+k+'" aria-pressed="'+(state.k===k)+'"><b>K'+k+'</b>'+pennants(k)+'<small>'+n+' '+pl(n,'этап','этапа','этапов')+'</small></button>';
  }).join('');
  $('khint').hidden = !state.k; $('khint').textContent = state.k ? 'только K'+state.k : '';
}

function renderStrip(){
  $('mstrip').innerHTML = MONTHS.map((m,i)=>{
    const n = EVENTS.filter(e=>e.mkey===m.key && match(e)).length;
    return '<button class="mpill'+(n?'':' empty')+'" type="button" data-i="'+i+'" aria-pressed="'+(i===state.mi)+'">'+
      '<span class="y">'+m.y+'</span><span class="m">'+MS[m.m]+'</span><span class="n">'+(n?n+' '+pl(n,'этап','этапа','этапов'):'—')+'</span></button>';
  }).join('');
  const strip = $('mstrip'), act = strip.children[state.mi];
  if(act) strip.scrollLeft = act.offsetLeft - strip.clientWidth/2 + act.clientWidth/2;
}

function renderGrid(){
  const m = MONTHS[state.mi];
  $('mtitle').innerHTML = MN[m.m]+' <span>'+m.y+'</span>';
  $('prev').disabled = state.mi===0;
  $('nextm').disabled = state.mi===MONTHS.length-1;
  const offset = (new Date(m.y,m.m,1).getDay()+6)%7;
  const days = new Date(m.y,m.m+1,0).getDate();
  const evs = EVENTS.filter(e=>e.a && match(e));
  let h = '';
  for(let i=0;i<offset;i++) h += '<span class="day blank"></span>';
  for(let d=1; d<=days; d++){
    const dt = new Date(m.y,m.m,d), t = dt.getTime();
    const e = evs.find(x=>x.a.getTime()<=t && x.b.getTime()>=t);
    let cls = 'day', sty = '';
    if(e){
      cls += ' has'; sty = ' style="--c:'+color(e)+'"';
      if(e.a.getTime()===t) cls += ' start';
      if(e.b.getTime()===t) cls += ' end';
    }
    if(t===TODAY.getTime()) cls += ' today';
    if(state.day===d) cls += ' sel';
    h += '<button type="button" class="'+cls+'"'+sty+' data-d="'+d+'" aria-label="'+d+' '+MG[m.m]+(e?', '+e.t:'')+'"><span>'+d+'</span></button>';
  }
  $('grid').innerHTML = h;
}

function renderMonthList(){
  const m = MONTHS[state.mi];
  let evs = EVENTS.filter(e=>e.mkey===m.key && match(e));
  let head;
  if(state.day){
    const t = new Date(m.y,m.m,state.day).getTime();
    evs = evs.filter(e=>e.a && e.a.getTime()<=t && e.b.getTime()>=t);
    head = '<div class="lhead"><h4>'+state.day+' '+MG[m.m]+'</h4><button type="button" id="clearDay">Показать весь месяц</button></div>';
  } else {
    head = '<div class="lhead"><h4>Этапы месяца</h4><span>'+evs.length+' '+pl(evs.length,'этап','этапа','этапов')+'</span></div>';
  }
  const body = evs.length ? evs.map(card).join('')
    : '<div class="empty">'+(state.day?'В этот день этапов нет.':'В этом месяце нет этапов по выбранному фильтру.')+'</div>';
  $('mlist').innerHTML = head + body;
}

function renderSeason(){
  let h = '';
  MONTHS.forEach(m=>{
    const evs = EVENTS.filter(e=>e.mkey===m.key && match(e));
    if(!evs.length) return;
    h += '<div class="lhead"><h4>'+MN[m.m]+' '+m.y+'</h4><span>'+evs.length+' '+pl(evs.length,'этап','этапа','этапов')+'</span></div>'+evs.map(card).join('');
  });
  const loose = EVENTS.filter(e=>!e.mkey && match(e));
  if(loose.length) h += '<div class="lhead"><h4>Дата по назначению</h4><span>'+loose.length+' '+pl(loose.length,'этап','этапа','этапов')+'</span></div>'+loose.map(card).join('');
  $('slist').innerHTML = h || '<div class="empty">По выбранному фильтру этапов нет.</div>';
}

function render(){
  renderChips(); renderK();
  $('vMonth').setAttribute('aria-pressed', state.view==='month');
  $('vSeason').setAttribute('aria-pressed', state.view==='season');
  $('monthView').hidden = state.view!=='month';
  $('seasonView').hidden = state.view!=='season';
  if(state.view==='month'){ renderStrip(); renderGrid(); renderMonthList(); }
  else renderSeason();
}

function setMonth(i){
  if(i<0 || i>=MONTHS.length) return;
  state.mi = i; state.day = null; render();
}

$('chips').addEventListener('click', ev=>{
  const b = ev.target.closest('[data-s]'); if(!b) return;
  state.series = b.dataset.s; state.day = null; render();
});
$('krow').addEventListener('click', ev=>{
  const b = ev.target.closest('[data-k]'); if(!b) return;
  const k = +b.dataset.k; state.k = state.k===k ? 0 : k; state.day = null; render();
});
$('mstrip').addEventListener('click', ev=>{
  const b = ev.target.closest('[data-i]'); if(b) setMonth(+b.dataset.i);
});
$('grid').addEventListener('click', ev=>{
  const b = ev.target.closest('[data-d]'); if(!b) return;
  const d = +b.dataset.d; state.day = state.day===d ? null : d;
  renderGrid(); renderMonthList();
});
$('mlist').addEventListener('click', ev=>{
  if(ev.target.id==='clearDay'){ state.day = null; renderGrid(); renderMonthList(); }
});
$('prev').addEventListener('click', ()=>setMonth(state.mi-1));
$('nextm').addEventListener('click', ()=>setMonth(state.mi+1));
$('vMonth').addEventListener('click', ()=>{ state.view='month'; render(); });
$('vSeason').addEventListener('click', ()=>{ state.view='season'; render(); });
$('next').addEventListener('click', ()=>{
  if(!upcoming) return;
  state.series='all'; state.k=0; state.view='month';
  state.mi = MONTHS.findIndex(m=>m.key===upcoming.mkey); state.day = upcoming.a.getDate();
  render();
  $('cal').scrollIntoView({behavior:'smooth', block:'start'});
});

// Свайп по сетке листает месяцы
let sx = null;
$('cal').addEventListener('touchstart', e=>{ sx = e.touches[0].clientX; }, {passive:true});
$('cal').addEventListener('touchend', e=>{
  if(sx===null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if(Math.abs(dx) > 60) setMonth(state.mi + (dx<0 ? 1 : -1));
}, {passive:true});

// Telegram Mini App
try{
  const tg = window.Telegram && window.Telegram.WebApp;
  if(tg){ tg.ready(); tg.expand(); if(tg.setHeaderColor) tg.setHeaderColor('#143272'); if(tg.setBackgroundColor) tg.setBackgroundColor('#061430'); }
}catch(e){}

renderFacts(); renderNext(); render();

// Заставка «Подъём паруса»: раз за сессию, пропуск по нажатию, ?intro=1 показывает всегда
(function(){
  const sp = $('splash'); if(!sp) return;
  let seen = false;
  try{ seen = sessionStorage.getItem('tsc_intro')==='1'; }catch(e){}
  const force = /[?&]intro=1/.test(location.search);
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if((seen && !force) || reduce){ sp.remove(); return; }
  try{ sessionStorage.setItem('tsc_intro','1'); }catch(e){}

  // Логотип: рисуется линией
  const kids = Array.from(document.querySelector('.top .logo').children);
  const svg = document.querySelector('.top .logo').cloneNode(true);
  svg.setAttribute('class','sp-svg');
  Array.from(svg.children).forEach((el,i)=>{
    el.setAttribute('pathLength','1');
    el.setAttribute('class', i===0 ? 'sc' : i===1 ? 'tz' : 'sh');
  });
  $('spLogo').appendChild(svg);

  // Щит для эмблемы на парусе (те же контуры, что в логотипе)
  let emblem = [];
  try{
    emblem = kids.slice(2).map(el=>{
      if(el.tagName.toLowerCase()==='polygon'){
        const p = el.getAttribute('points').trim().split(/[\s,]+/).map(Number);
        let d = 'M'+p[0]+' '+p[1];
        for(let i=2;i<p.length;i+=2) d += 'L'+p[i]+' '+p[i+1];
        return new Path2D(d+'Z');
      }
      return new Path2D(el.getAttribute('d'));
    });
  }catch(e){ emblem = []; }

  const cv = document.createElement('canvas'); cv.className = 'sp-cv';
  sp.insertBefore(cv, sp.firstChild);
  const ctx = cv.getContext('2d');
  let W=0, H=0, dpr=1;
  function size(){
    dpr = Math.min(2, window.devicePixelRatio||1);
    W = sp.clientWidth; H = sp.clientHeight;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  }
  size(); window.addEventListener('resize', size);

  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const prog = (t,a,b)=>clamp((t-a)/(b-a),0,1);
  const eOut = p=>1-Math.pow(1-p,3);
  const eIn = p=>p*p*p;
  const eIO = p=>p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
  const lerp = (a,b,p)=>a+(b-a)*p;

  const TZ0=1.8, TZ1=2.3, TD=2.3, TEND=3.15, SPEED=1.2;
  const streaks = Array.from({length:14}, ()=>({y:.06+Math.random()*.64, len:40+Math.random()*80, sp:260+Math.random()*300, a:.08+Math.random()*.18, o:Math.random()}));

  function wave(t, yBase, amp, k, speed, fill, crest){
    const pts = [];
    for(let x=-20; x<=W+20; x+=8){
      const ph = t*speed;
      pts.push([x, yBase + amp*Math.sin(x*k+ph) + amp*.45*Math.sin(x*k*2.3-ph*1.4)]);
    }
    ctx.beginPath(); ctx.moveTo(-20, H+40);
    pts.forEach(p=>ctx.lineTo(p[0],p[1]));
    ctx.lineTo(W+20, H+40); ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    if(crest){
      ctx.beginPath(); pts.forEach((p,i)=> i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]));
      ctx.strokeStyle = crest; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }
  function line(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }

  function boat(t, u, cx, wl, gust){
    const pin = eOut(prog(t,.3,.85)); if(pin<=0) return;
    const bob = Math.sin(t*3.2)*3*u;
    const pitch = (1.6*Math.sin(t*2.3) + 6*gust) * Math.PI/180;
    ctx.save();
    ctx.translate(cx - (1-pin)*130*u + gust*16*u, wl + bob);
    ctx.rotate(pitch); ctx.scale(u,u); ctx.globalAlpha = pin; ctx.lineCap = 'round';

    // мачта и штаги
    const pm = eOut(prog(t,.5,1));
    ctx.strokeStyle = '#D6E4FF'; ctx.lineWidth = 3; line(0,-12,0,-12-246*pm);
    if(pm>=1){ ctx.lineWidth = .7; ctx.strokeStyle = 'rgba(214,228,255,.55)'; line(0,-258,88,-17); line(0,-258,-76,-15); }

    // грот: поднимается по мачте и надувается
    const ph = eOut(prog(t,.8,1.5));
    if(ph>0){
      const belly = 13 + 5*Math.sin(t*4.2) + gust*16 + (1-ph)*9*Math.sin(t*24);
      const tx=-4, ty=-34, hx=-4, hy=-34-214*ph, kx=-86, ky=-30;
      const c1x=(hx+kx)/2 - belly*.94, c1y=(hy+ky)/2 - belly*.34;
      const c2x=(tx+kx)/2, c2y=ty+5+belly*.3;
      ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(hx,hy);
      ctx.quadraticCurveTo(c1x,c1y,kx,ky); ctx.quadraticCurveTo(c2x,c2y,tx,ty); ctx.closePath();
      const g = ctx.createLinearGradient(kx-belly,0,tx,0);
      g.addColorStop(0,'#A9CBFF'); g.addColorStop(.55,'#EAF3FF'); g.addColorStop(1,'#FFFFFF');
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = 'rgba(36,76,154,.28)'; ctx.lineWidth = .8;
      for(let i=1;i<5;i++){
        const f=i/5, s=1-f;
        const lx=(1-s)*(1-s)*hx + 2*(1-s)*s*c1x + s*s*kx, ly=(1-s)*(1-s)*hy + 2*(1-s)*s*c1y + s*s*ky;
        line(hx, lerp(ty,hy,f), lx, ly);
      }
      const pe = prog(t,1.3,1.55)*ph;
      if(pe>0 && emblem.length){
        ctx.save(); ctx.globalAlpha = pin*pe*.9; ctx.translate(-33-belly*.25,-98);
        const k = 27/193; ctx.scale(k,k); ctx.translate(-798.7,-256);
        ctx.fillStyle = '#244C9A'; emblem.forEach(p=>ctx.fill(p)); ctx.restore();
      }
      ctx.strokeStyle = '#D6E4FF'; ctx.lineWidth = 2.6; line(tx,ty+2,kx-5,ky+2);
    }

    // стаксель: раскрывается от штага
    const pj = eOut(prog(t,1.05,1.55));
    if(pj>0){
      const jb = 9 + 4*Math.sin(t*4.6+1) + gust*12 + (1-pj)*7*Math.sin(t*26);
      const ax=86, ay=-17, bx=2, by=-238, kx=lerp(46,9,pj), ky=lerp(-128,-31,pj);
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
      ctx.quadraticCurveTo((bx+kx)/2+jb,(by+ky)/2,kx,ky);
      ctx.quadraticCurveTo((ax+kx)/2,(ay+ky)/2+jb*.5,ax,ay); ctx.closePath();
      const g2 = ctx.createLinearGradient(0,0,90,0);
      g2.addColorStop(0,'#5FA0FF'); g2.addColorStop(1,'#BBD8FF');
      ctx.globalAlpha = pin*.96; ctx.fillStyle = g2; ctx.fill(); ctx.globalAlpha = pin;
    }

    // корпус
    ctx.beginPath(); ctx.moveTo(-80,-15); ctx.lineTo(94,-17);
    ctx.quadraticCurveTo(82,5,58,9); ctx.lineTo(-62,9); ctx.quadraticCurveTo(-76,5,-80,-15); ctx.closePath();
    ctx.fillStyle = '#F2F7FF'; ctx.fill();
    ctx.strokeStyle = '#3DD9EB'; ctx.lineWidth = 2.2; line(-76,-8,86,-9.5);
    ctx.restore();
  }

  function scene(t){
    const u = Math.min(W/400, H/800);
    const wl = H*.80, cx = W*.5;
    const gust = eIO(prog(t,1.5,1.95));
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#143272'); g.addColorStop(.55,'#0B2052'); g.addColorStop(1,'#061430');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    const pz = eIn(prog(t,TZ0,TZ1));
    ctx.save();
    if(pz>0){ const fx=cx-22*u, fy=wl-96*u, s=1+pz*36; ctx.translate(fx,fy); ctx.scale(s,s); ctx.translate(-fx,-fy); }

    // свечение за парусами
    const pg = prog(t,.4,1.3);
    const rg = ctx.createRadialGradient(cx,wl-130*u,0,cx,wl-130*u,260*u);
    rg.addColorStop(0,'rgba(61,217,235,'+(.26*pg)+')'); rg.addColorStop(1,'rgba(61,217,235,0)');
    ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);

    // ветер
    const pw = prog(t,.2,.8);
    ctx.lineCap = 'round'; ctx.lineWidth = 1.4;
    streaks.forEach(s=>{
      const span = W + s.len*2;
      const x = ((s.o*span + t*s.sp*(1+gust*1.8)) % span) - s.len;
      ctx.strokeStyle = 'rgba(255,255,255,'+((s.a+gust*.22)*pw)+')';
      line(x, s.y*H, x+s.len*(1+gust), s.y*H);
    });

    const rise = (1-eOut(prog(t,0,.7)))*140;
    wave(t, wl-8*u+rise, 6*u, .017, 1.6, '#1B4498', null);
    boat(t, u, cx, wl, gust);
    wave(t, wl+5*u+rise, 7*u, .021, -2.3, '#12327A', 'rgba(255,255,255,.55)');
    wave(t, wl+36*u+rise, 9*u, .013, 1.9, '#0A2158', 'rgba(255,255,255,.22)');
    ctx.restore();

    const wo = prog(t, TZ0+(TZ1-TZ0)*.5, TZ1);
    if(wo>0){ ctx.fillStyle = 'rgba(244,249,255,'+wo+')'; ctx.fillRect(0,0,W,H); }
  }

  // Белизна паруса растворяется в морской воде, и вода уходит вниз, открывая календарь
  function wash(t){
    const p = eIO(prog(t,TD,TD+.8));
    const base = -80 + (H+190)*p;
    const edge = (x,off)=> base + off + 15*Math.sin(x*.016+t*5) + 8*Math.sin(x*.037-t*7.5);
    const shape = off=>{
      ctx.beginPath(); ctx.moveTo(-20, H+40);
      for(let x=-20; x<=W+20; x+=8) ctx.lineTo(x, edge(x,off));
      ctx.lineTo(W+20, H+40); ctx.closePath();
    };
    shape(-30); ctx.fillStyle = 'rgba(61,217,235,.2)'; ctx.fill();
    shape(-12); ctx.fillStyle = 'rgba(47,102,200,.55)'; ctx.fill();
    shape(0);
    const g = ctx.createLinearGradient(0, base-30, 0, base+H*.9);
    g.addColorStop(0,'#2F66C8'); g.addColorStop(.35,'#16357C'); g.addColorStop(1,'#061430');
    ctx.fillStyle = g; ctx.fill();
    ctx.beginPath();
    for(let x=-20; x<=W+20; x+=8){ const y = edge(x,0); x===-20 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); }
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.6; ctx.stroke();
    const wf = 1 - prog(t,TD,TD+.22);
    if(wf>0){ ctx.fillStyle = 'rgba(244,249,255,'+wf+')'; ctx.fillRect(0,0,W,H); }
  }

  function countUp(){
    const b = document.querySelector('#next .count:not(.live) b'); if(!b) return;
    const target = parseInt(b.textContent,10); if(!(target>0)) return;
    const t0 = performance.now(), dur = 900;
    (function step(t){
      const p = Math.min(1,(t-t0)/dur);
      b.textContent = Math.round(target*eOut(p));
      if(p<1) requestAnimationFrame(step);
    })(t0);
  }

  let raf = 0, done = false, zoomed = false, revealed = false, sped = false;
  const start = performance.now();
  function finish(){
    if(done) return; done = true;
    cancelAnimationFrame(raf); window.removeEventListener('resize', size);
    if(sp.parentNode) sp.remove();
  }
  function frame(now){
    if(done) return;
    const t = (now-start)/1000*SPEED;
    if(!sped){ sped = true; try{ document.getAnimations().forEach(a=>{ const el = a.effect && a.effect.target; if(el && sp.contains(el)) a.playbackRate = SPEED; }); }catch(e){} }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    if(!zoomed && t>=TZ0){ zoomed = true; sp.classList.add('zoom'); }
    if(t<TD) scene(t);
    else{
      if(!revealed){
        revealed = true; sp.style.background = 'transparent';
        document.body.classList.add('reveal'); countUp();
        setTimeout(()=>document.body.classList.remove('reveal'), 1700);
      }
      wash(t);
    }
    if(t<TEND) raf = requestAnimationFrame(frame); else finish();
  }
  raf = requestAnimationFrame(frame);
  setTimeout(finish, 7000);
  sp.addEventListener('click', ()=>{ document.body.classList.remove('reveal'); finish(); });
})();
</script>
</body>
</html>
